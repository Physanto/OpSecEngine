  usa_canario: true
  oraculos: ["EXCEPCION-NO-CAPTURADA", "TRAZA-EN-DIALOGO", "APP-TERMINADA"]
  descripcion: "Salto de línea de formato junto a una marca rastreable."

- id: "FORMATO-X-CANARIO"
  categoria: "CADENAS_FORMATO"
  aplica_a: ["TEXTO"]
  payload: "%x{canario}"
  usa_canario: true
  oraculos: ["EXCEPCION-NO-CAPTURADA", "TRAZA-EN-DIALOGO", "APP-TERMINADA"]
  descripcion: "Conversión hexadecimal junto a una marca rastreable."
