# Oráculo implementado. F6 es el único fallo activo.
# Validar el formato no demuestra que la ejecución detecte el fallo.
suite: f6
version: "1"
enfoques: [SEGURIDAD]
config:
  modo: SEMANTICO
  esperaMaximaPasoMs: 10000
casos:
  - id: F6-CASO
    descripcion: "Iniciar sesión y observar si la contraseña aparece en consola."
    oraculos: [CONTRASENA-EN-CONSOLA]
    pasos:
      - pulsar: Avanzar
      - pulsar: Nube
      - llenar: {Usuario: "Admin", Contraseña: "Admin#2026"}
      - pulsar: Iniciar Sesion
      - esperar: {tituloVentana: Menú administrador}
