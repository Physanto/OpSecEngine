nombre: integracion-f10-vulnerable
app:
  jar: ../../../clientes-vulnerable/target/clientes-vulnerable.jar
  argumentosJvm: ["-Dpractica.corregir=F1,F2,F3,F4,F5,F6,F7,F8,F9"]
roles:
  admin: {usuario: Admin, contrasena: "Admin#2026"}
  cliente: {usuario: Cliente, contrasena: "Cliente#2026"}
