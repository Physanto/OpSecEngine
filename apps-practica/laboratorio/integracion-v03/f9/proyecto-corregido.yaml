# Integración #67: F9 corregido. Validar no equivale a detectar.
nombre: integracion-f9-corregido
app:
  jar: ../../../clientes-vulnerable/target/clientes-vulnerable.jar
  argumentosJvm: ["-Dpractica.corregir=todos"]
roles:
  admin: {usuario: Admin, contrasena: "Admin#2026"}
  cliente: {usuario: Cliente, contrasena: "Cliente#2026"}
login:
  pasos:
    - pulsar: Avanzar
    - pulsar: Nube
    - llenar: {Usuario: "{usuario}", Contraseña: "{contrasena}"}
    - pulsar: Iniciar Sesion
