# Integración #67: F9 vulnerable. Validar no equivale a detectar.
nombre: integracion-f9-vulnerable
app:
  jar: ../../../clientes-vulnerable/target/clientes-vulnerable.jar
  argumentosJvm: ["-Dpractica.corregir=F1,F2,F3,F4,F5,F6,F7,F8,F10,F11,F12,F13"]
roles:
  admin: {usuario: Admin, contrasena: "Admin#2026"}
  cliente: {usuario: Cliente, contrasena: "Cliente#2026"}
